name: Deploy Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Build Cloud Functions
        run: |
          npm ci
          npm run build
        working-directory: functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build admin web (Firebase Hosting)
        run: |
          flutter pub get
          flutter build web --release
        working-directory: apps/admin

      - name: Deploy rules and hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy \
            --only firestore,database,hosting \
            --project papakejamanekegaane \
            --non-interactive

      - name: Deploy Cloud Functions (requires Blaze plan)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        continue-on-error: true
        run: |
          firebase deploy \
            --only functions \
            --project papakejamanekegaane \
            --non-interactive
