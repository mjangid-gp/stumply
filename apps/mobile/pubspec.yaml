name: crick_app
description: Stumply - score cricket matches, stream live, and manage tournaments.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  scoring_engine:
    path: ../../packages/scoring_engine

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_database: ^11.2.0
  firebase_storage: ^12.3.7
  firebase_messaging: ^15.1.6
  firebase_analytics: ^11.3.6
  firebase_crashlytics: ^4.2.0
  firebase_app_check: ^0.3.1+7
  cloud_functions: ^5.2.0

  # State & architecture
  flutter_riverpod: ^2.6.1

  # Navigation & UI
  go_router: ^14.6.2
  cached_network_image: ^3.4.1
  fl_chart: ^0.69.2
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # Local storage & offline
  connectivity_plus: ^6.1.1

  # Auth providers
  google_sign_in: ^6.2.2

  # Utilities
  intl: ^0.20.1
  uuid: ^4.5.1
  share_plus: ^10.1.3
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3

  # Monetization (Phase 4-6)
  purchases_flutter: ^8.3.2
  google_mobile_ads: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#1B4332"
  adaptive_icon_foreground: assets/images/app_icon.png
  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: "#1B4332"
    theme_color: "#1B4332"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
